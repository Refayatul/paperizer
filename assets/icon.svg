<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="60%" stop-color="#F4E4C1"/>
      <stop offset="100%" stop-color="#E2CA9B"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B982"/>
      <stop offset="100%" stop-color="#BE9B5C"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Page Shadow & Background -->
  <path d="M28 16 H84 L104 36 V112 C104 114.2 102.2 116 100 116 H28 C25.8 116 24 114.2 24 112 V20 C24 17.8 25.8 16 28 16 Z" 
        fill="url(#warmGrad)" filter="url(#dropShadow)" stroke="#B89B6C" stroke-width="1.5"/>

  <!-- Folded Corner -->
  <path d="M84 16 V34 C84 35.1 84.9 36 86 36 H104 Z" 
        fill="url(#foldGrad)"/>

  <!-- Paper Texture Accent Lines -->
  <line x1="38" y1="48" x2="80" y2="48" stroke="#8C6E41" stroke-width="3.5" stroke-linecap="round" opacity="0.65"/>
  <line x1="38" y1="62" x2="90" y2="62" stroke="#8C6E41" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <line x1="38" y1="74" x2="90" y2="74" stroke="#8C6E41" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
  <line x1="38" y1="86" x2="72" y2="86" stroke="#8C6E41" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

  <!-- Warmth Sparkle / Sun Icon in Bottom Right -->
  <circle cx="86" cy="98" r="8" fill="#E67E22" opacity="0.9"/>
  <path d="M86 86 V89 M86 107 V110 M74 98 H77 M95 98 H98 M77.5 89.5 L79.6 91.6 M92.4 104.4 L94.5 106.5 M77.5 106.5 L79.6 104.4 M92.4 91.6 L94.5 89.5" 
        stroke="#E67E22" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
</svg>
