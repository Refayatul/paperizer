[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperizer"
version = "0.1.0"
description = "A quiet, native PDF reader & warm paper styler for Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Refayatul" }]
keywords = ["pdf", "gui", "qt6", "pyside6", "paperizer", "paperize", "accessibility", "reading", "parchment", "kde"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "PySide6>=6.6",
    "pikepdf>=10.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
upstream = ["paperize-pdf>=0.3.0"]

[project.scripts]
paperizer = "paperize_gui.app:main"
paperize-gui = "paperize_gui.app:main"

[project.urls]
"Homepage" = "https://github.com/Refayatul/paperizer"
"Bug Tracker" = "https://github.com/Refayatul/paperizer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paperize_gui"]
