[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperize-gui"
version = "0.1.0"
description = "Modern Qt6 GUI for paperize - turn glaring white PDFs into comfortable, warm paper"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kai", email = "kai@example.com" }]
keywords = ["pdf", "gui", "qt6", "pyside6", "paperize", "accessibility", "reading", "parchment", "kde"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "PySide6>=6.6",
    "pikepdf>=10.0",
    "pymupdf>=1.24",
    "paperize-pdf>=0.3.0",
]

[project.scripts]
paperizer = "paperize_gui.app:main"
paperize-gui = "paperize_gui.app:main"

[project.urls]
"Homepage" = "https://github.com/kai/paperize-gui"
"Bug Tracker" = "https://github.com/kai/paperize-gui/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paperize_gui"]
